# Full self-hosted stack: postgres + redis + api + worker + web.
# `make up` (or `docker compose -f deploy/docker-compose.yml up --build`) from the repo root.
name: omni-bugtracker

services:
  postgres:
    image: postgres:16-alpine
    # Survive host reboots / dockerd restarts (matches the other self-hosted omni
    # services). Without a policy the stack stays Exited after a reboot.
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omni_bugtracker
    # Loopback-only + overridable port: dev gets localhost:5432; prod sets a
    # non-conflicting port (e.g. 15432) so it never clashes with a host Postgres.
    ports: ["127.0.0.1:${OMNI_BT_PG_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni_bugtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${OMNI_BT_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply goose schema + River queue tables, then exit.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    entrypoint: ["/app/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://omni:omni@postgres:5432/omni_bugtracker?sslmode=disable
      OMNI_BT_DATABASE__DSN: postgres://omni:omni@postgres:5432/omni_bugtracker?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    environment:
      OMNI_BT_DATABASE__DSN: postgres://omni:omni@postgres:5432/omni_bugtracker?sslmode=disable
      OMNI_BT_REDIS__ADDR: redis:6379
      OMNI_BT_SERVER__ADDR: ":8080"
      # /metrics + probes, on a listener that is deliberately not in `ports:` below.
      OMNI_BT_SERVER__METRICS_ADDR: ":9091"
      OMNI_BT_STORAGE__ATTACHMENTS_DIR: /app/data/attachments
      # Omni-Notify ingest (host-published behind its netviz sidecar). Token in .env.
      OMNI_BT_INTEGRATIONS__NOTIFY__BASE_URL: ${OMNI_BT_NOTIFY_URL:-http://omni-notify:8080}
      OMNI_BT_INTEGRATIONS__NOTIFY__API_TOKEN: ${OMNI_BT_NOTIFY_TOKEN:-}
      # Omni Identity: token verification (issuer/JWKS/audience) and the browser
      # login flow (a public PKCE client; the code exchange runs in the API).
      # Browser-facing URLs (authorize, end_session, redirect, post-logout) use
      # the public HTTPS names; server-to-server ones (JWKS, token, userinfo)
      # use the issuer address on the LAN. All from .env; empty leaves login off.
      OMNI_BT_IDENTITY__ISSUER: ${OMNI_BT_IDENTITY_ISSUER:-}
      OMNI_BT_IDENTITY__JWKS_URL: ${OMNI_BT_IDENTITY_JWKS_URL:-}
      OMNI_BT_IDENTITY__AUDIENCE: ${OMNI_BT_IDENTITY_AUDIENCE:-}
      OMNI_BT_IDENTITY__CLIENT_ID: ${OMNI_BT_IDENTITY_CLIENT_ID:-}
      OMNI_BT_IDENTITY__AUTHORIZE_URL: ${OMNI_BT_IDENTITY_AUTHORIZE_URL:-}
      OMNI_BT_IDENTITY__TOKEN_URL: ${OMNI_BT_IDENTITY_TOKEN_URL:-}
      OMNI_BT_IDENTITY__USERINFO_URL: ${OMNI_BT_IDENTITY_USERINFO_URL:-}
      OMNI_BT_IDENTITY__END_SESSION_URL: ${OMNI_BT_IDENTITY_END_SESSION_URL:-}
      OMNI_BT_IDENTITY__REDIRECT_URI: ${OMNI_BT_IDENTITY_REDIRECT_URI:-}
      OMNI_BT_IDENTITY__SCOPES: ${OMNI_BT_IDENTITY_SCOPES:-openid profile email offline_access}
      OMNI_BT_IDENTITY__POST_LOGOUT_URL: ${OMNI_BT_IDENTITY_POST_LOGOUT_URL:-}
      # Ship our own logs to Omni-Logging as well as stdout. Stays off unless both
      # are set in .env, so a deploy without them behaves exactly as before.
      OMNI_BT_LOG__SHIP__ENABLED: ${OMNI_BT_LOGSHIP_ENABLED:-false}
      OMNI_BT_LOG__SHIP__ENDPOINT: ${OMNI_BT_LOGSHIP_URL:-http://omni-logging:8080/api/v1/ingest}
      OMNI_BT_LOG__SHIP__API_KEY: ${OMNI_BT_LOGSHIP_KEY:-}
    volumes: ["attachments:/app/data/attachments"]
    # Published on loopback only: the web container proxies /api and /auth to
    # it, and browsers reach the tracker through Omni Access
    # (https://bugtracker.omni.pod32g.dev), which joins this compose network
    # and talks to the containers by name. The host port stays for local
    # debugging. Set OMNI_BT_BIND=0.0.0.0 to publish on the LAN again.
    ports: ["${OMNI_BT_BIND:-127.0.0.1}:${OMNI_BT_API_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    restart: unless-stopped
    environment:
      OMNI_BT_DATABASE__DSN: postgres://omni:omni@postgres:5432/omni_bugtracker?sslmode=disable
      OMNI_BT_REDIS__ADDR: redis:6379
      OMNI_BT_INTEGRATIONS__NOTIFY__BASE_URL: ${OMNI_BT_NOTIFY_URL:-http://omni-notify:8080}
      OMNI_BT_INTEGRATIONS__NOTIFY__API_TOKEN: ${OMNI_BT_NOTIFY_TOKEN:-}
      OMNI_BT_LOG__SHIP__ENABLED: ${OMNI_BT_LOGSHIP_ENABLED:-false}
      OMNI_BT_LOG__SHIP__ENDPOINT: ${OMNI_BT_LOGSHIP_URL:-http://omni-logging:8080/api/v1/ingest}
      OMNI_BT_LOG__SHIP__API_KEY: ${OMNI_BT_LOGSHIP_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    ports: ["${OMNI_BT_BIND:-127.0.0.1}:${OMNI_BT_WEB_PORT:-3000}:80"]
    depends_on: [api]

volumes:
  pgdata:
  attachments:
