server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API per request through Docker's embedded DNS instead of once
    # at startup. A literal `proxy_pass http://api:8080` pins whatever address
    # `api` had when nginx loaded; a reboot or a restart reshuffles the network's
    # IPs, and nginx keeps proxying to the stale one. On 2026-09-08 a host reboot
    # did exactly that: every /api/ request got 502, connecting to what had become
    # the worker. With the upstream in a variable nginx re-resolves (cached for
    # `valid`), and it also starts even if the API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + operational endpoints to the backend service.
    location /api/ {
        # Deliberately looser than the API's own storage.max_upload_mb (25MB default).
        # nginx must never be the thing that rejects an upload: it answers 413 with an
        # HTML error page, which is not problem+json, so the client cannot read a limit
        # out of it and shows the bare HTTP reason phrase instead. Leaving headroom here
        # keeps the API the single enforcement point — MaxBytesReader rejects oversize
        # bodies with a problem+json that names the real limit. Raise this only to stay
        # above max_upload_mb; lowering it to "match" reintroduces the opaque 413.
        client_max_body_size 64m;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser OIDC login flow (same-origin so the httpOnly session cookie is first-party).
    location /auth/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
